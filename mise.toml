# https://mise.jdx.dev/bootstrap.html
# 新しいマシンでは ./bin/mise bootstrap --yes で一括セットアップする
min_version = "2026.7.5"

# このリポジトリの開発用ツール（lint用）
[tools]
actionlint = "latest"
ghalint = "latest"
pinact = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
zizmor = "latest"

[tasks.lint]
description = "全リンターを実行"
depends = ["lint:*"]

[tasks."lint:shell"]
description = "シェルスクリプトのlintとフォーマットチェック"
run = [
  "git grep -l '^#!.*bash' -- ':!bin' | xargs -r shellcheck",
  "git grep -l '^#!.*bash' -- ':!bin' | xargs -r shfmt --diff",
]

[tasks."lint:actions"]
description = "GitHub Actionsワークフローのチェック"
run = [
  "actionlint",
  "zizmor .github/workflows/",
  "ghalint run",
  "pinact run --check",
]

[tasks."lint:toml"]
description = "TOMLファイルのチェック"
run = ["git ls-files '*.toml' | xargs -r taplo fmt --check --diff"]

[tasks."lint:json"]
description = "JSONファイルの構文チェック（コメント付きJSONを許容するkarabinerは除外）"
run = [
  "git ls-files '*.json' ':!configs/.config/karabiner' | xargs -rI{} jq empty {}",
]

[tasks.pre-commit]
description = "pre-commitフックから実行される（mise generate git-pre-commitで接続）"
depends = ["lint"]

[settings]
experimental = true
# ソースは configs/ 以下にホームディレクトリと同じ構造でミラーする
dotfiles.root = "~/ghq/github.com/oh84/dotfiles/configs"

[dotfiles]

# brew
"~/.Brewfile" = { mode = "symlink" }
"~/.Brewfile.cask" = { mode = "symlink" }
"~/.Brewfile.mas" = { mode = "symlink" }

# git
"~/.config/git/config" = { mode = "symlink" }
"~/.config/git/ignore" = { mode = "symlink" }
"~/.config/git/hooks/" = { mode = "symlink" }
"~/.config/git/templates/" = { mode = "symlink" }
# ソースはgit管理外（ソースが無いとapplyが失敗するためpre-dotfilesフックで作成）
"~/.config/git/private/" = { mode = "symlink" }

# zsh
"~/.zshrc" = { mode = "symlink" }
"~/.config/sheldon/plugins.toml" = { mode = "symlink" }

# starship
"~/.config/starship.toml" = { mode = "symlink" }

# tmux
"~/.tmux.conf" = { mode = "symlink" }

# vim
"~/.vimrc" = { mode = "symlink" }

# mise
"~/.config/mise/config.toml" = { mode = "symlink" }
"~/.default-gems" = { mode = "symlink" }
"~/.default-go-packages" = { mode = "symlink" }
"~/.default-npm-packages" = { mode = "symlink" }
"~/.default-python-packages" = { mode = "symlink" }

# secretlint
"~/.config/secretlint/.secretlintrc.json" = { mode = "symlink" }

# ghostty
"~/.config/ghostty/config" = { mode = "symlink" }

# Claude
"~/.claude/CLAUDE.md" = { mode = "symlink" }
"~/.claude/settings.json" = { mode = "symlink" }
"~/.claude/statusline.sh" = { mode = "symlink" }
"~/.claude/commands/" = { mode = "symlink" }
"~/.claude/skills/" = { mode = "symlink" }

# karabiner・hammerspoon
# macOS専用だが、Linuxでリンクされても無害なのでOS分岐はしない
# karabinerはファイル単体ではなくディレクトリごとリンクする
# https://karabiner-elements.pqrs.org/docs/manual/misc/configuration-file-path/
"~/.config/karabiner/" = { mode = "symlink" }
"~/.hammerspoon/init.lua" = { mode = "symlink" }

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[bootstrap.hooks.pre-dotfiles]
run = "mkdir -p ~/ghq/github.com/oh84/dotfiles/configs/.config/git/private"
