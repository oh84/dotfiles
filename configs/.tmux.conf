# ==============================================================================
# プラグイン
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # セッションを保存・復元できるようにする
set -g @plugin 'tmux-plugins/tmux-continuum' # セッションを自動で保存・復元できるようにする
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'thewtex/tmux-mem-cpu-load' # tmux source ~/.tmux.conf 時にビルドに失敗するのでコメントアウトして brew でインストールする

# ==============================================================================
# プラグインの設定
# ==============================================================================

# tmux-loggingの設定
set -g @logging-path "$HOME/logs/tmux"
set -g @screen-capture-path "$HOME/logs/tmux"
set -g @save-complete-history-path "$HOME/logs/tmux"
# tmux-loggingのショートカットキー
# https://github.com/tmux-plugins/tmux-logging
# 1. prefix + shift + p       : Toggle (start/stop) logging in the current pane.
# 2. prefix + alt + p         : Save visible text, in the current pane.
# 3. prefix + alt + shift + p : Save complete pane history to a file.

# tmux-continuumの設定
set -g @continuum-save-interval '1' # セッション保存間隔を1分に変更
set -g @continuum-restore 'on'      # tmux起動時にセッションを自動復元する

# tmux-prefix-highlightの設定
set -g @prefix_highlight_fg "colour236"
set -g @prefix_highlight_bg "colour3"

# ==============================================================================
# キーバインド
# ==============================================================================

# PrefixをCtrl-jに変更
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# ペイン分割のキーバインドを設定
# ウィンドウ・ペインを現在のディレクトリで開くように設定
bind c new-window -c '#{pane_current_path}'
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# ペイン幅を均等に整列するキーバインドを設定
bind | select-layout even-horizontal
bind = select-layout even-vertical

# ペイン間移動のキーバインドを設定
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ペイン幅リサイズのキーバインドを設定
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモードのキーバインドをviライクに設定
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection

# ==============================================================================
# マウス
# ==============================================================================

# マウスでのウィンドウやペインの切り替え・リサイズを可能にする
set -g mouse on # tmux2.1以降

# マウスでの範囲選択後に自動でコピーモードを終了しないようにする
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# ステータスライン
# ==============================================================================

set -g status-fg "colour248"
set -g status-bg "colour237"
set -g status-position bottom
set -g status-interval 1
setw -g status-left-length 50
setw -g status-left "#[fg=colour237,bg=colour248,bold] #S #[default]"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour255,bg=colour241,bold] #I:#W#F "
setw -g status-right-length 100
# setw -g status-right "#[fg=colour236,bg=colour3]#{prefix_highlight}#[fg=colour237,bg=colour248,bold] #(tmux-mem-cpu-load -g 5 -a 0) #[default]"
setw -g status-right "#[fg=colour236,bg=colour3]#{prefix_highlight} #[default]"

# ==============================================================================
# ウィンドウ
# ==============================================================================

# ウィンドウの開始番号を1に変更
set -g base-index 1

# ウィンドウを閉じたときにインデックス番号を自動で振り直す
set-option -g renumber-windows on

# ウィンドウ名をカレントディレクトリ名にする
set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# ==============================================================================
# その他
# ==============================================================================

# TrueColor対応 (https://www.pandanoir.info/entry/2019/11/02/202146)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",$TERM:Tc"

# ==============================================================================
# プラグインの初期化
# ==============================================================================

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
